# 2026-08-14: this file previously carried a three-tier free/professional/enterprise
# SCAFFOLD written by the 2026-05-04 bulk sweep, with invented quotas (1,000 and
# 100,000 requests/month) and an invented Free tier. Openprise publishes no free tier.
# Replaced wholesale with the two tiers Openprise actually publishes, read verbatim
# from the pricing page. See roadmap#35.
tags:
  - Data Automation
  - Data Quality
  - Marketing Operations
  - RevOps
  - Sales Operations
description: >-
  Openprise publishes two plans on its pricing page — Professional, with a stated
  entry price, and Enterprise, priced on application. There is no free tier, no
  self-serve sign-up, and no per-request or per-seat list price: both tiers are sold
  annually with unlimited user seats, and the metered dimensions are records per bot
  run and API calls per day. API Factory itself is a separately licensed feature.
