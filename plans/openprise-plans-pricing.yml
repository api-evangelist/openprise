notes:
  - >-
    The pricing page publishes no per-call overage rate and no price for exceeding a
    daily API allowance; every allowance is written with a "+" ("5,000+ API calls per
    day"), so the published figure is a floor, not a cap.
  - >-
    "Transformations allowed (Integration project)" appears as a line item on both tiers
    with no value published.
  - >-
    A "Dedicated sandbox" is an Enterprise-tier entitlement, not a public developer
    sandbox. Openprise publishes no self-serve trial, no test credentials, and no test
    mode, so no sandbox/ artifact was written.
  - >-
    API Factory is described in the Help Center as "a licensed feature of the Openprise
    platform" that must be enabled per tenant, independent of the plan tier shown here.
