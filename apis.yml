aid: openprise
name: Openprise
description: >-
  Openprise is an AI and data orchestration platform built for enterprise
  go-to-market teams — RevOps, marketing operations and sales operations. It
  cleans, unifies and activates GTM data across CRM, marketing automation and data
  warehouse systems through no-code Jobs and Bots, with 400+ pre-built connectors,
  multi-vendor enrichment waterfalls, deduplication, lead-to-account matching,
  routing, scoring and segmentation. Its developer-facing surface is API Factory, a
  licensed feature that turns any configured Job or Bot into a per-tenant REST
  endpoint callable from Marketo webhooks, Salesforce triggers, web forms or any
  system that can issue an HTTP POST. Openprise coined the term "data orchestration"
  in 2017 and is headquartered in San Mateo, California.
