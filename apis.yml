apis:
  - aid: openprise:openprise-api
    name: Openprise API Factory
    description: >-
      API Factory turns any Openprise Job or Bot into a REST endpoint with a single
      "Enable API" action. The caller sends an HTTP POST carrying a JSON array of
      records and receives a JSON array of processed records back. Endpoints are
      generated per tenant, authenticated with a per-user API key created on the My
      Account page, and their request/response contract is shown inside the
      application via the "View API Docs" action — which is also the only place the
      endpoint URL is published. API Factory is a separately licensed feature that a
      tenant administrator must enable under Administration → Settings → Features.
      Openprise publishes no OpenAPI document and no fixed public base URL.
    humanURL: https://www.openprisetech.com/api-factory
