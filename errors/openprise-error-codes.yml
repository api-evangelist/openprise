description: >-
  Openprise publishes no RFC 9457 problem type registry and no HTTP error-code reference —
  there is no OpenAPI to derive 4xx/5xx responses from, because API Factory endpoints are
  generated per tenant. What Openprise DOES publish is a curated Errors section in its Help
  Center: eleven named failure conditions with causes and remediation. That is the real
  error surface, captured below. Each entry carries a `layer` so a consumer can tell an
  Openprise platform error from a downstream CRM/MAP error Openprise merely relays.
envelope:
  http: null
  note: >-
    No HTTP error envelope is documented. Failures surface in two places — as a job-run
    error string in the Openprise UI and job log (sometimes carrying a numeric errorCode,
    e.g. "{errorCode:4001, errorMessage:...}"), or, for outbound Call Simple REST API
    tasks, as record-level attributes written back onto the record.
  outbound_attributes:
    - name: op_RESTAPI_success
      description: Whether the outbound call succeeded.
    - name: op_RESTAPI_error_message
      description: The error text returned by the external service.
    - name: op_RESTAPI_request_id
      description: Openprise-generated identifier for the outbound request.
    - name: op_RESTAPI_request_time
      description: Timestamp of the outbound request.
  source: https://helpcenter.openprisetech.com/hc/en-us/articles/27776528482324-Call-Simple-REST-API-Webhook
errors:
  - code: '4001'
    layer: openprise-platform
    title: Maximum allowed records in a duplicate group is 10000
    detail: >-
      A de-duplication job produced a duplicate group larger than the platform ceiling of
      10,000 records.
    remediation: Tighten the matching criteria so groups stay under the ceiling.
    source: https://helpcenter.openprisetech.com/hc/en-us/articles/24107427607572-Error-Error-while-running-job-errorCode-4001-errorMessage-Maximum-allowed-records-in-a-duplicate-group-is-10000-10xxx-records-found-in-a-duplicate-group
  - code: job-resources-exhausted
    layer: openprise-platform
    title: This job has exhausted available resources
    detail: >-
      "Additional resources have been secured and will be used for the next run and no
      changes to the job are required." A soft capacity ceiling that self-heals.
    remediation: None required; re-run.
    source: https://helpcenter.openprisetech.com/hc/en-us/articles/24107418620052-Error-This-job-has-exhausted-available-resources-Additional-resources-have-been-secured-and-will-be-used-for-the-next-run-and-no-changes-to-the-job-are-required
  - code: unable-to-clone-job
    layer: openprise-platform
    title: 'Error: Unable to Clone Job'
    source: https://helpcenter.openprisetech.com/hc/en-us/articles/24733099430420-Error-Unable-to-Clone-Job
  - code: data-target-offline
    layer: openprise-platform
    title: Error while running Job — Data target is off-line
    source: https://helpcenter.openprisetech.com/hc/en-us/articles/24107509734804-Error-Error-while-running-Job-Data-target-is-off-line
  - code: credentials-already-in-use
    layer: openprise-platform
    title: >-
      These credential(s) are already being used, please get in touch with <name> to get
      shared access
    detail: >-
      Connection credentials are owned by an Openprise group; a second user cannot bind
      the same credential without being granted shared access.
    remediation: Grant the requesting user's group access under Security Settings → Credentials.
    source: https://helpcenter.openprisetech.com/hc/en-us/articles/24107479600788-Error-These-credential-s-are-already-being-used-please-get-in-touch-with-someone-s-name-to-get-shared-access
