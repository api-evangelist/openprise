description: >-
  Lifecycle posture for the Openprise platform and its API Factory surface. Openprise
  ships numbered calendar releases with published notes going back to 2017, but there is
  no API version identifier, no deprecation or sunset policy, no public status page, and
  no published SLA. Support response targets are published on the pricing page.
