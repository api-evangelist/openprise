description: >-
  Openprise publishes dated platform release notes in its Help Center, one article per
  calendar year, back to 2017. Releases are numbered within the year (Release 1, 2, 3, …)
  and each entry separates "New features and enhancements" from "Bug fixes". These are
  PLATFORM releases, not API versions — API Factory endpoints carry no version identifier.
